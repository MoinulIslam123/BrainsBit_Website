<div class="fixed bottom-5 right-4 z-40 flex flex-col items-end gap-3 sm:bottom-7 sm:right-7">
  <!-- Back to top, with a ring that fills as you scroll -->
  <button
    type="button"
    (click)="toTop()"
    aria-label="Back to top"
    class="group relative grid h-12 w-12 place-items-center rounded-full bg-ink text-white shadow-lift transition-all duration-500 hover:-translate-y-1"
    [class]="visible() ? 'translate-y-0 scale-100 opacity-100' : 'pointer-events-none translate-y-6 scale-75 opacity-0'"
    [tabIndex]="visible() ? 0 : -1"
  >
    <svg class="absolute inset-0 -rotate-90" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle cx="24" cy="24" r="22" stroke="rgba(255,255,255,0.16)" stroke-width="2" />
      <circle
        cx="24"
        cy="24"
        r="22"
        stroke="#2b94f2"
        stroke-width="2.5"
        stroke-linecap="round"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="dashOffset()"
      />
    </svg>
    <i class="fa-solid fa-chevron-up text-sm transition-transform duration-300 group-hover:-translate-y-0.5"></i>
  </button>

  <!-- WhatsApp -->
  <a
    [href]="company.whatsappLink"
    target="_blank"
    rel="noopener"
    aria-label="Chat on WhatsApp"
    class="group relative flex items-center"
  >
    <span
      class="pointer-events-none absolute right-full mr-3 translate-x-2 whitespace-nowrap rounded-full bg-white px-4 py-2 text-sm font-semibold text-ink opacity-0 shadow-lift transition-all duration-300 group-hover:translate-x-0 group-hover:opacity-100"
    >
      Chat on WhatsApp
    </span>
    <span
      class="relative grid h-14 w-14 place-items-center rounded-full bg-[#25d366] text-white shadow-[0_14px_30px_-8px_rgba(37,211,102,0.85)] transition-transform duration-300 group-hover:scale-110"
    >
      <span class="absolute inset-0 animate-pulse-ring rounded-full bg-[#25d366]"></span>
      <i class="fa-brands fa-whatsapp relative text-[1.9rem]"></i>
    </span>
  </a>
</div>
