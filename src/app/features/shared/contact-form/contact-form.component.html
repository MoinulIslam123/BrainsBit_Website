<form #f="ngForm" (ngSubmit)="submit(f)" novalidate>
  <div class="grid gap-5 sm:grid-cols-2">
    <div>
      <label for="cf-name" class="mb-1.5 block text-sm font-semibold text-ink">Name</label>
      <input
        id="cf-name"
        type="text"
        name="name"
        autocomplete="name"
        placeholder="Your name"
        [(ngModel)]="model.name"
        #name="ngModel"
        required
        class="form-field"
      />
      <p *ngIf="name.invalid && name.touched" class="mt-1.5 text-sm text-red-600">
        Enter your name.
      </p>
    </div>

    <div>
      <label for="cf-company" class="mb-1.5 block text-sm font-semibold text-ink">Company</label>
      <input
        id="cf-company"
        type="text"
        name="company"
        autocomplete="organization"
        placeholder="Company name"
        [(ngModel)]="model.company"
        class="form-field"
      />
    </div>

    <div>
      <label for="cf-email" class="mb-1.5 block text-sm font-semibold text-ink">Email</label>
      <input
        id="cf-email"
        type="email"
        name="email"
        autocomplete="email"
        placeholder="you@company.com"
        [(ngModel)]="model.email"
        #email="ngModel"
        required
        email
        class="form-field"
      />
      <p *ngIf="email.invalid && email.touched" class="mt-1.5 text-sm text-red-600">
        Enter a valid email address.
      </p>
    </div>

    <div>
      <label for="cf-phone" class="mb-1.5 block text-sm font-semibold text-ink">Phone</label>
      <input
        id="cf-phone"
        type="tel"
        name="phone"
        autocomplete="tel"
        placeholder="Phone number"
        [(ngModel)]="model.phone"
        class="form-field"
      />
    </div>
  </div>

  <div class="mt-5">
    <label for="cf-message" class="mb-1.5 block text-sm font-semibold text-ink">Message</label>
    <textarea
      id="cf-message"
      name="message"
      rows="4"
      placeholder="Tell us about your project"
      [(ngModel)]="model.message"
      #message="ngModel"
      required
      class="form-field !h-32 resize-none py-3"
    ></textarea>
    <p *ngIf="message.invalid && message.touched" class="mt-1.5 text-sm text-red-600">
      Write a short message.
    </p>
  </div>

  <button type="submit" [disabled]="sending" class="btn btn-primary mt-6 w-full sm:w-auto disabled:cursor-not-allowed disabled:opacity-60">
    <i class="fa-solid" [ngClass]="sending ? 'fa-circle-notch fa-spin' : 'fa-paper-plane'"></i>
    {{ sending ? 'Sending' : 'Send message' }}
  </button>

  <div aria-live="polite">
    <p *ngIf="status === 'success'" class="mt-4 font-medium text-green-700">
      Message sent. We will get back to you soon.
    </p>
    <p *ngIf="status === 'error'" class="mt-4 font-medium text-red-600">
      The message was not sent. Check your connection and try again.
    </p>
  </div>
</form>
