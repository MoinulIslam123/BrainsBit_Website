<app-hero></app-hero>

<app-clients-marquee></app-clients-marquee>

<!-- SERVICES: cards that stack as you scroll -->
<section class="wrap section">
  <div appReveal="up" class="grid gap-6 lg:grid-cols-[1fr_1fr] lg:items-end lg:gap-16">
    <h2 class="t-h2">Our services</h2>
    <p class="lead">{{ servicesIntro }}</p>
  </div>

  <div class="mt-14 space-y-6">
    <article
      *ngFor="let c of cards; let i = index"
      class="overflow-hidden rounded-[2.25rem] border p-6 shadow-lift sm:p-8 lg:sticky lg:p-12"
      [style.top.rem]="7 + i * 1.5"
      [ngClass]="c.card"
    >
      <div class="grid items-center gap-8 lg:grid-cols-[1fr_1.1fr] lg:gap-14">
        <div>
          <span class="grid h-12 w-12 place-items-center rounded-2xl text-lg" [ngClass]="c.icon">
            <i class="fa-solid" [ngClass]="c.iconName"></i>
          </span>
          <h3
            class="mt-6 font-display text-[clamp(1.9rem,3.4vw,3rem)] font-bold leading-[1.02] tracking-[-0.035em]"
            [ngClass]="c.title"
          >
            {{ c.navLabel }}
          </h3>
          <p class="mt-4 text-lg leading-relaxed" [ngClass]="c.body">{{ c.text }}</p>
          <a [routerLink]="['/services', c.slug]" class="btn mt-8" [ngClass]="c.btn">
            Learn more <i class="fa-solid fa-chevron-right text-[0.65rem]"></i>
          </a>
        </div>

        <app-stage class="aspect-[5/4] w-full">
          <app-service-scene [kind]="c.scene"></app-service-scene>
        </app-stage>
      </div>
    </article>
  </div>
</section>

<!-- WHAT WE OFFER -->
<section class="wrap pb-16 md:pb-24">
  <div class="relative isolate overflow-hidden rounded-[2.5rem] bg-ink p-6 sm:p-10 lg:p-16">
    <div class="absolute inset-0 -z-10 opacity-60 [background-image:radial-gradient(rgba(255,255,255,0.1)_1.2px,transparent_1.6px)] [background-size:26px_26px] [mask-image:radial-gradient(ellipse_at_85%_0%,#000_10%,transparent_65%)]"></div>
    <div class="absolute -right-24 -top-32 -z-10 h-96 w-96 animate-drift rounded-full bg-brand/40 blur-[110px]"></div>

    <div appReveal="up" class="grid gap-6 lg:grid-cols-2 lg:items-end lg:gap-16">
      <h2 class="t-h2 !text-white">What we offer</h2>
      <p class="text-lg leading-relaxed text-white/65">{{ offerIntro }}</p>
    </div>

    <div class="mt-12 grid gap-4 sm:grid-cols-2 lg:flex">
      <div
        *ngFor="let o of offers; let i = index"
        appReveal="up"
        [revealDelay]="i * 100"
        class="group relative flex min-h-[17rem] flex-col justify-between overflow-hidden rounded-3xl border border-white/10 bg-white/[0.04] p-7 transition-[flex,background-color,border-color] duration-500 hover:border-brand-bright/40 hover:bg-white/[0.09] lg:min-h-[21rem] lg:flex-1 lg:hover:flex-[1.6]"
      >
        <span
          class="grid h-14 w-14 place-items-center rounded-2xl bg-brand text-xl text-white shadow-[0_12px_30px_-10px_rgba(0,114,206,0.9)] transition-transform duration-500 group-hover:-rotate-6 group-hover:scale-110"
        >
          <i class="fa-solid" [ngClass]="o.icon"></i>
        </span>
        <div class="mt-10">
          <h3 class="font-display text-2xl font-semibold tracking-[-0.02em] text-white">{{ o.title }}</h3>
          <p class="mt-3 leading-relaxed text-white/60 transition-colors duration-300 group-hover:text-white/85">{{ o.text }}</p>
        </div>
      </div>
    </div>
  </div>
</section>

<app-call-us></app-call-us>
