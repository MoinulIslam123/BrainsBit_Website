<div
  class="relative h-[480px] w-[544px]"
  (pointermove)="onMove($event)"
  (pointerleave)="onLeave()"
  aria-hidden="true"
>
  <div
    class="absolute inset-0 transition-transform duration-300 ease-out will-change-transform"
    [style.transform]="transform"
  >
    <!-- WEB DASHBOARD -->
    <div
      class="animate-rise absolute left-0 top-12 w-[88%] overflow-hidden rounded-2xl border border-white/15 bg-white shadow-[0_44px_90px_-30px_rgba(0,0,0,0.75)]"
      style="animation-delay: 0.3s"
    >
      <div class="flex items-center gap-1.5 border-b border-line bg-slate-50 px-4 py-3">
        <span class="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
        <span class="ml-4 h-5 max-w-[11rem] flex-1 rounded-md border border-line bg-white"></span>
      </div>

      <div class="flex">
        <div class="hidden w-[22%] space-y-3 border-r border-line bg-slate-50 p-4 sm:block">
          <div class="h-2.5 w-4/5 rounded bg-brand"></div>
          <div class="h-2.5 w-3/5 rounded bg-slate-200"></div>
          <div class="h-2.5 w-4/5 rounded bg-slate-200"></div>
          <div class="h-2.5 w-2/5 rounded bg-slate-200"></div>
          <div class="h-2.5 w-3/5 rounded bg-slate-200"></div>
        </div>

        <div class="flex-1 p-4 sm:p-5">
          <div class="grid grid-cols-3 gap-3">
            <div class="rounded-xl border border-line p-3">
              <p class="text-[10px] text-slate-400">Revenue</p>
              <p class="font-display text-lg font-bold text-ink">$24.8k</p>
            </div>
            <div class="rounded-xl border border-line p-3">
              <p class="text-[10px] text-slate-400">Orders</p>
              <p class="font-display text-lg font-bold text-ink">1,284</p>
            </div>
            <div class="rounded-xl border border-line p-3">
              <p class="text-[10px] text-slate-400">Uptime</p>
              <p class="font-display text-lg font-bold text-ink">99.98%</p>
            </div>
          </div>

          <svg viewBox="0 0 320 120" class="mt-4 w-full" fill="none">
            <defs>
              <linearGradient id="hs-area" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#0072ce" stop-opacity="0.22" />
                <stop offset="1" stop-color="#0072ce" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path class="chart-area" d="M0 96 L40 84 L80 90 L120 62 L160 70 L200 42 L240 52 L280 24 L320 30 V120 H0 Z" fill="url(#hs-area)" />
            <path class="chart-line" pathLength="100" d="M0 96 L40 84 L80 90 L120 62 L160 70 L200 42 L240 52 L280 24 L320 30" stroke="#0072ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
            <rect class="chart-node" x="274" y="18" width="12" height="12" rx="3" fill="#0072ce" />
          </svg>
        </div>
      </div>
    </div>

    <!-- MOBILE APP -->
    <div class="animate-rise absolute -bottom-1 right-0 w-40 sm:w-44" style="animation-delay: 0.5s">
    <div
      class="animate-float rounded-[2.2rem] border border-white/15 bg-[#0c1a38] p-1.5 shadow-[0_44px_80px_-25px_rgba(0,0,0,0.85)]"
      style="animation-duration: 7s; animation-delay: -2s"
    >
      <div class="overflow-hidden rounded-[1.8rem] bg-white px-3.5 pb-4 pt-3">
        <div class="mx-auto mb-3 h-1.5 w-14 rounded-full bg-slate-200"></div>
        <p class="font-display text-sm font-bold text-ink">Orders</p>

        <div class="mt-3 flex items-center gap-2">
          <span class="h-7 w-7 rounded-full bg-brand-soft"></span>
          <div class="flex-1 space-y-1">
            <div class="h-2 w-3/4 rounded bg-slate-200"></div>
            <div class="h-2 w-1/2 rounded bg-slate-100"></div>
          </div>
          <span class="text-[10px] font-semibold text-mint">Paid</span>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <span class="h-7 w-7 rounded-full bg-brand-soft"></span>
          <div class="flex-1 space-y-1">
            <div class="h-2 w-2/3 rounded bg-slate-200"></div>
            <div class="h-2 w-2/5 rounded bg-slate-100"></div>
          </div>
          <span class="text-[10px] font-semibold text-mint">Paid</span>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <span class="h-7 w-7 rounded-full bg-brand-soft"></span>
          <div class="flex-1 space-y-1">
            <div class="h-2 w-4/5 rounded bg-slate-200"></div>
            <div class="h-2 w-1/3 rounded bg-slate-100"></div>
          </div>
          <span class="text-[10px] font-semibold text-slate-400">Due</span>
        </div>

        <div class="mt-4 rounded-xl bg-brand py-2.5 text-center text-[11px] font-semibold text-white">
          Track delivery
        </div>
      </div>
    </div>
    </div>

    <!-- QA CHIP -->
    <div class="animate-rise absolute -left-2 top-0" style="animation-delay: 0.7s">
      <div
        class="animate-float flex items-center gap-3 rounded-2xl bg-white px-4 py-3 text-ink shadow-lift"
        style="animation-delay: -1s"
      >
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-mint/20 text-mint">
          <i class="fa-solid fa-check"></i>
        </span>
        <div>
          <p class="text-sm font-semibold leading-tight">128 tests passed</p>
          <p class="text-xs text-muted">Quality assurance</p>
        </div>
      </div>
    </div>

    <!-- RELEASE CHIP -->
    <div class="animate-rise absolute bottom-8 left-4" style="animation-delay: 0.85s">
      <div
        class="animate-float flex items-center gap-3 rounded-2xl bg-white px-4 py-3 text-ink shadow-lift"
        style="animation-delay: -3.5s"
      >
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-soft text-brand">
          <i class="fa-solid fa-rocket"></i>
        </span>
        <div>
          <p class="text-sm font-semibold leading-tight">Deployed to production</p>
          <p class="text-xs text-muted">Release 2.4.1</p>
        </div>
      </div>
    </div>
  </div>
</div>
